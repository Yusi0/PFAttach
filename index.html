<!DOCTYPE html>
<html lang="ko" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PF Attachment Database ver. 11.15.0c</title>
    <style>
        /* CSS 변수 설계 (테마용) */
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --bg-glass: rgba(255, 255, 255, 0.4);
            --border-glass: rgba(255, 255, 255, 0.3);
            --shadow-glass: rgba(31, 38, 135, 0.08);
            --text-color: #2c3e50;
            --text-muted: #7f8c8d;
            --accent-color: #5c6bc0;
            --card-bg: rgba(255, 255, 255, 0.45);
            --card-title: #1a252f;
            --table-header: rgba(255, 255, 255, 0.5);
            --badge-green: rgba(46, 204, 113, 0.2);
            --badge-green-text: #27ae60;
            --badge-red: rgba(231, 76, 60, 0.2);
            --badge-red-text: #c0392b;
            --benefit-text: #178a46;
            --penalty-text: #c7352f;
            --filter-active-bg: rgba(92, 107, 192, 0.18);
            --chip-bg: rgba(255, 255, 255, 0.34);
            --sim-base-bar: rgba(127, 127, 127, 0.25);
            --sim-base-border: #7f8c8d;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --bg-glass: rgba(15, 23, 42, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --shadow-glass: rgba(0, 0, 0, 0.3);
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-color: #818cf8;
            --card-bg: rgba(15, 23, 42, 0.7);
            --card-title: #f8fafc;
            --table-header: rgba(15, 23, 42, 0.5);
            --benefit-text: #7ddf9f;
            --penalty-text: #ff8b86;
            --filter-active-bg: rgba(129, 140, 248, 0.18);
            --chip-bg: rgba(255, 255, 255, 0.08);
            --sim-base-bar: rgba(255, 255, 255, 0.24);
            --sim-base-border: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
            -ms-overflow-style: none;
            /* IE/Edge 스크롤바 숨기기 */
            scrollbar-width: none;
            /* Firefox 스크롤바 숨기기 */
        }

        /* Chrome, Safari, Opera, Edge (Webkit) 스크롤바 숨기기 */
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }

        /* 글래스모피즘용 고정 배경 광원 */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.55;
            transition: all 0.5s ease;
        }

        .blob-1 {
            width: 320px;
            height: 320px;
            background: #a78bfa;
            top: 10%;
            left: -80px;
        }

        .blob-2 {
            width: 300px;
            height: 300px;
            background: #60a5fa;
            bottom: 15%;
            right: -80px;
        }

        /* 모바일 우선 컨테이너 */
        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 90px;
            /* 하단 네비게이션 공간 */
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 글래스 공통 프레임 */
        .glass-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            box-shadow: 0 8px 32px 0 var(--shadow-glass);
            border-radius: 20px;
            padding: 16px;
            transition: all 0.3s ease;
        }

        /* 헤더 레이아웃 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--card-title);
        }

        .theme-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid var(--border-glass);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            color: var(--text-color);
            transition: background 0.3s;
        }

        .theme-btn:active {
            transform: scale(0.95);
        }

        /* 검색창 */
        .search-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 10px 14px;
            position: sticky;
            top: 10px;
            z-index: 80;
            box-shadow: 0 4px 20px var(--shadow-glass);
        }

        /* 플로팅 컨트롤 버튼 스타일 */
        .floating-jump-btn:hover {
            opacity: 0.7;
        }

        .floating-jump-btn:active {
            transform: scale(0.95);
        }

        #scrollTopBtn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        #scrollTopBtn:active {
            transform: translateY(0) scale(0.9);
        }

        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            width: 100%;
            font-size: 0.95rem;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        /* 탭 컨텐츠 관리 */
        .tab-content {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .tab-content.active {
            display: flex;
        }

        .filter-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px -10px var(--shadow-glass);
            border-radius: 22px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .filter-panel {
            background: rgba(20, 25, 45, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 12px 35px -10px rgba(0, 0, 0, 0.5);
        }

        .filter-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-bottom: 6px;
            border-bottom: 1px dashed rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] .filter-header {
            border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
        }

        .filter-header-title {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 0.5px;
        }

        .filter-header-icon {
            display: flex;
            align-items: center;
            color: var(--accent-color);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-label {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-muted);
            margin-left: 2px;
        }

        .filter-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            /* ← 추가: iOS 관성 스크롤 */
            cursor: grab;
            /* ← 추가: 데스크탑 드래그 커서 */
        }

        .filter-row::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            border: 1px solid var(--border-glass);
            background: var(--chip-bg);
            color: var(--text-color);
            opacity: 0.85;
            border-radius: 12px;
            padding: 7px 12px;
            font-size: 0.76rem;
            font-weight: 800;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-chip:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.6);
            border-color: var(--accent-color);
        }

        [data-theme="dark"] .filter-chip:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .filter-chip.active {
            opacity: 1;
            color: #ffffff;
            background: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 4px 12px rgba(92, 107, 192, 0.25);
        }

        [data-theme="dark"] .filter-chip.active {
            box-shadow: 0 4px 12px rgba(129, 140, 248, 0.35);
        }

        .section-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 8px;
            border-radius: 10px;
            transition: background 0.2s, opacity 0.2s;
            cursor: pointer;
            user-select: none;
        }

        .section-heading:hover {
            background: rgba(255, 255, 255, 0.18);
            opacity: 0.95;
        }

        [data-theme="dark"] .section-heading:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .section-heading h3 {
            color: var(--card-title);
            font-size: 0.92rem;
            font-weight: 900;
        }

        .section-count {
            color: var(--text-muted);
            font-size: 0.74rem;
            font-weight: 700;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag-pill {
            border-radius: 999px;
            border: 1px solid var(--border-glass);
            background: var(--chip-bg);
            padding: 4px 8px;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-muted);
        }

        .text-benefit {
            color: var(--benefit-text);
            font-weight: 800;
        }

        .text-penalty {
            color: var(--penalty-text);
            font-weight: 800;
        }

        /* 카드 리스트 */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .item-card:hover {
            border-color: rgba(92, 107, 192, 0.35);
            box-shadow: 0 10px 24px var(--shadow-glass);
        }

        .item-card:active {
            transform: scale(0.98);
        }

        .item-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
        }

        .item-card-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--card-title);
            line-height: 1.25;
        }

        .badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.25);
            color: var(--text-color);
            border: 1px solid var(--border-glass);
            flex-shrink: 0;
        }

        /* 상세 설명 전환 탭 */
        .desc-tab-btn {
            background: none;
            border: none;
            padding: 6px 12px;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
            outline: none;
        }

        .desc-tab-btn:hover {
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .desc-tab-btn.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }

        .stat-chip-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .stat-chip {
            min-width: 0;
            background: var(--chip-bg);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 8px 10px;
        }

        .stat-chip-label {
            display: block;
            font-size: 0.68rem;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 0;
            margin-bottom: 3px;
        }

        .stat-chip-value {
            display: block;
            font-size: 0.82rem;
            color: var(--text-color);
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            gap: 12px;
        }

        .card-footer-link {
            color: var(--accent-color);
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 2px;
            transition: transform 0.2s ease;
        }

        .card-footer-link svg {
            transition: transform 0.2s ease;
        }

        .item-card:hover .card-footer-link svg {
            transform: translateX(3px);
        }

        .empty-state {
            color: var(--text-muted);
            text-align: center;
            padding: 28px 10px;
        }

        /* 상세 모달 팝업 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.24s ease-out;
            overflow-y: auto;
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
        }

        .modal::-webkit-scrollbar {
            display: none;
            /* Chrome, Safari, Opera */
        }

        .modal-content {
            width: 100%;
            max-width: 440px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 20px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: scale(0.9) translateY(10px);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal.active .modal-content {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            color: var(--text-color);
            cursor: pointer;
        }

        /* 표 스타일 (구글 문서 / 마크다운 렌더링 스타일) */
        .stat-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.85rem;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-glass);
        }

        .stat-table th,
        .stat-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-glass);
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .stat-table th {
            background: var(--table-header);
            font-weight: 700;
            color: var(--card-title);
        }

        .stat-table td {
            background: rgba(255, 255, 255, 0.1);
        }

        .stat-row-title {
            font-weight: 600;
            color: var(--text-muted);
        }

        .markdown-block {
            color: var(--text-color);
            font-size: 0.86rem;
            line-height: 1.65;
            word-break: keep-all;
            overflow-wrap: anywhere;
        }

        .markdown-block p {
            margin: 0;
        }

        .markdown-block strong {
            color: var(--card-title);
            font-weight: 800;
        }

        .section-title {
            font-weight: 800;
            font-size: 0.95rem;
            color: var(--card-title);
            margin-top: 5px;
        }

        /* 비교 기능 UI */
        .compare-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .selector-box {
            display: flex;
            gap: 10px;
        }

        /* 커스텀 셀렉트 드롭다운 스타일 */
        .custom-select-wrapper {
            position: relative;
            width: 50%;
            user-select: none;
        }

        .custom-select-trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            padding: 10px 14px;
            border-radius: 12px;
            color: var(--text-color);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .custom-select-trigger::after {
            content: "";
            width: 6px;
            height: 6px;
            border-right: 2px solid var(--text-color);
            border-bottom: 2px solid var(--text-color);
            transform: rotate(45deg);
            margin-bottom: 2px;
            transition: transform 0.3s ease;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .custom-select-wrapper.open .custom-select-trigger::after {
            transform: rotate(-135deg);
            margin-bottom: -2px;
        }

        .custom-options {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            box-shadow: 0 10px 24px var(--shadow-glass);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.25s cubic-bezier(0, 0, 0.2, 1);
            max-height: 250px;
            overflow-y: auto;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        [data-theme="dark"] .custom-options {
            background: rgba(15, 23, 42, 0.9);
        }

        .custom-select-wrapper.open .custom-options {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .custom-option {
            padding: 10px 14px;
            font-size: 0.88rem;
            color: var(--text-color);
            cursor: pointer;
            transition: background 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .custom-option:hover {
            background: rgba(92, 107, 192, 0.15);
        }

        .custom-option.selected {
            background: rgba(92, 107, 192, 0.25);
            color: var(--accent-color);
            font-weight: 700;
        }

        .custom-options::-webkit-scrollbar {
            width: 5px;
        }

        .custom-options::-webkit-scrollbar-thumb {
            background: var(--border-glass);
            border-radius: 999px;
        }

        .compare-badge-up {
            background: var(--badge-green);
            color: var(--badge-green-text);
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: bold;
        }

        .compare-badge-down {
            background: var(--badge-red);
            color: var(--badge-red-text);
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: bold;
        }

        /* 하단 고정 네비게이션 */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 448px;
            height: 60px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            box-shadow: 0 8px 32px 0 var(--shadow-glass);
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
        }

        [data-theme="dark"] .bottom-nav {
            background: rgba(15, 23, 42, 0.7);
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            width: 33%;
            height: 100%;
            justify-content: center;
            transition: color 0.2s;
        }

        .nav-btn.active {
            color: var(--accent-color);
        }

        .nav-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        #floatingControlCenter {
            position: fixed;
            bottom: 85px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px var(--shadow-glass);
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
        }

        @media (min-width: 480px) {
            #floatingControlCenter {
                right: calc(50% - 224px);
            }
        }
    </style>
</head>

<body>

            if (e && e.currentTarget) {
                e.currentTarget.classList.add('active');
            }

            const cc = document.getElementById('floatingControlCenter');
            if (tabName === 'list') {
                document.getElementById('listTab').classList.add('active');
                if (window.scrollY > 200) {
                    cc.style.opacity = '1';
                    cc.style.pointerEvents = 'auto';

            } else if (tabName === 'compare') {

                renderCompare();

                "'": "&#39;"

            const query = filterText.trim().toLowerCase();

            const inSearch = !query || item.name.toLowerCase().includes(query) || item.category.toLowerCase().includes(query) || item.oneLiner.toLowerCase().includes(query);

        function formatMiniStat(text) {
            if (!text || text.includes("변화 없음")) {
                return `<span style="color: var(--text-muted); font-weight: 500;">-</span>`;
            }

            // Check if it's a range like "10~20%"
            const rangeMatch = text.match(/(\d+(?:\.\d+)?)\s*~\s*(\d+(?:\.\d+)?)/);
            let pctText = "";
            if (rangeMatch) {
                pctText = `${rangeMatch[1]}~${rangeMatch[2]}%`;
            } else {
                const percentMatch = text.match(/(\d+(?:\.\d+)?%)/);
                if (percentMatch) {
                    pctText = percentMatch[1];
                } else {
                    return `<span style="color: var(--accent-color); font-weight: 700; font-size: 0.72rem;">반전</span>`;
                }
            }

            if (text.includes("감소") || text.includes("안정") || text.includes("완화") || text.includes("감쇠") || text.includes("단축") || text.includes("개선")) {
                return `<span style="color: var(--benefit-text); font-weight: 800;">↓${pctText}</span>`;
            }
            if (text.includes("증가") || text.includes("패널티") || text.includes("지연") || text.includes("악화") || text.includes("상승")) {
                return `<span style="color: var(--penalty-text); font-weight: 800;">↑${pctText}</span>`;
            }
            return `<span style="color: var(--text-color); font-weight: 700;">${pctText}</span>`;
        }

        function parseRecoilValue(text) {
            if (!text || text.includes("변화 없음")) return 0;

            // Check if it's a range like "10~20%"
            const rangeMatch = text.match(/(\d+(?:\.\d+)?)\s*~\s*(\d+(?:\.\d+)?)/);
            let value = 0;
            if (rangeMatch) {
                value = (parseFloat(rangeMatch[1]) + parseFloat(rangeMatch[2])) / 2;
            } else {
                // Extract all percentages and average them
                const matches = [...text.matchAll(/(\d+(?:\.\d+)?)/g)];
                if (matches.length > 0) {
                    const sum = matches.reduce((acc, m) => acc + parseFloat(m[1]), 0);
                    value = sum / matches.length;
                } else {
                    return 0;
                }
            }

            // Check if it represents a reduction or an increase
            if (text.includes("감소") || text.includes("안정") || text.includes("완화") || text.includes("감쇠") || text.includes("단축") || text.includes("개선")) {
                return -value;
            }
            if (text.includes("증가") || text.includes("패널티") || text.includes("지연") || text.includes("악화") || text.includes("상승")) {
                return value;
            }
            return 0;
        }

        function getBarStyles(valText) {
            const x = parseRecoilValue(valText);
            const maxVal = 40; // 40% is the max scale of recoil change
            const clamped = Math.min(Math.max(x, -maxVal), maxVal);

            const widthPct = Math.abs(clamped) * (50 / maxVal); // max 50% width
            let leftPct;
            let color;

            if (clamped < 0) {
                leftPct = 50 - widthPct;
                color = "var(--benefit-text)";
            } else if (clamped > 0) {
                leftPct = 50;
                color = "var(--penalty-text)";
            } else {
                leftPct = 50;
                color = "transparent";
            }

            return { left: leftPct, width: widthPct, color };
        }

                        <!-- Filled bar -->
                        <div class="stat-fill-bar" data-left="${styles.left}" data-width="${styles.width}" style="position: absolute; top: 0; bottom: 0; left: 50%; width: 0%; background: ${styles.color}; border-radius: 2px; transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);"></div>

                    return `<span>${value}</span>`;

            if (value.includes("증가") || value.includes("패널티") || value.includes("지연") || value.includes("악화") || value.includes("상승")) {

        function initDragScroll(selector) {
            const sliders = document.querySelectorAll(selector);
            sliders.forEach(slider => {
                let isDown = false;
                let startX;
                let scrollLeft;

                slider.addEventListener('mousedown', (e) => {
                    isDown = true;
                    slider.style.cursor = 'grabbing';
                    startX = e.pageX - slider.offsetLeft;
                    scrollLeft = slider.scrollLeft;
                });

                slider.addEventListener('mouseleave', () => {
                    isDown = false;
                    slider.style.cursor = 'grab';
                });

                slider.addEventListener('mouseup', () => {
                    isDown = false;
                    slider.style.cursor = 'grab';
                });

                slider.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - slider.offsetLeft;
                    const walk = (x - startX) * 1.5; // 스크롤 감도
                    slider.scrollLeft = scrollLeft - walk;
                });

                // 마우스 휠로 좌우 슬라이드(스크롤) 가능하게 구현
                slider.addEventListener('wheel', (e) => {
                    if (e.deltaY !== 0) {
                        e.preventDefault();
                        slider.scrollLeft += e.deltaY * 0.8; // 부드러운 스크롤 감도
                    }
                });
            });
        }

        // 플로팅 컨트롤 및 퀵점프 관련 함수
        function scrollToSection(id) {
            const el = document.getElementById(id);
            if (el) {
                const yOffset = -70; // sticky 검색창 고려 오프셋
                const y = el.getBoundingClientRect().top + window.pageYOffset + yOffset;
                window.scrollTo({ top: y, behavior: 'smooth' });
            }
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 스크롤 감지에 따른 플로팅 바 토글 (목록 탭에서만 활성화)
        window.addEventListener('scroll', () => {
            const cc = document.getElementById('floatingControlCenter');
            const listTab = document.getElementById('listTab');
            const isListTabActive = listTab && listTab.classList.contains('active');

            if (isListTabActive && window.scrollY > 200) {
                cc.style.opacity = '1';
                cc.style.pointerEvents = 'auto';
                cc.style.transform = 'translateY(0)';
            } else {
                cc.style.opacity = '0';
                cc.style.pointerEvents = 'none';
                cc.style.transform = 'translateY(10px)';
            }
        });

        // 로드아웃 시뮬레이터 로직
        const weaponCategoryMap = {
            "ar": "AR (돌격소총)",
            "pdw": "PDW (개인방어화기)",
            "dmr": "DMR (지정사수소총)",
            "lmg": "LMG (경기관총)",
            "sr": "SR (저격소총)",
            "br": "BR (전투소총)",
            "carbine": "Carbine (카빈)",
            "sg": "SG (산탄총)"
        };
        let selectedSimCategory = "ar";
        let selectedSimWeapon = "ak12";
        let selectedSimMuzzle = "none";
        let selectedSimGrip = "none";

        function initSimulator() {
            const categoryOptions = document.getElementById('simCategoryOptions');
            const categoryTrigger = document.getElementById('simCategoryTrigger');
            const categoryWrapper = document.getElementById('simCategoryWrapper');

            const weaponOptions = document.getElementById('simWeaponOptions');
            const weaponTrigger = document.getElementById('simWeaponTrigger');
            const weaponWrapper = document.getElementById('simWeaponWrapper');

            // 1. 총기 종류(계열) 드롭다운 옵션 생성
            categoryTrigger.innerText = weaponCategoryMap[selectedSimCategory] || "계열 선택";
            categoryOptions.innerHTML = "";
            categories.forEach(cat => {
                const opt = document.createElement('div');
                opt.className = `custom-option ${cat === selectedSimCategory ? 'selected' : ''}`;
                opt.innerText = weaponCategoryMap[cat];
                opt.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedSimCategory = cat;
                    categoryWrapper.classList.remove('open');

                    // 카테고리 변경 시, 첫 번째 총기로 자동 바인딩
                    const firstWeaponOfCat = weapons.find(w => w.catKey === cat);
                    selectedSimWeapon = firstWeaponOfCat ? firstWeaponOfCat.id : "";

                    initSimulator();
                });
                categoryOptions.appendChild(opt);
            });

            categoryTrigger.onclick = (e) => {
                e.stopPropagation();
                categoryWrapper.classList.toggle('open');
                weaponWrapper.classList.remove('open');
                document.getElementById('simMuzzleWrapper').classList.remove('open');
                document.getElementById('simGripWrapper').classList.remove('open');
            };

            // 2. 현재 선택된 계열에 필터링된 총기 목록
            const filteredWeapons = weapons.filter(w => w.catKey === selectedSimCategory);

            // 현재 선택된 총기 바인딩
            const currentWeapon = filteredWeapons.find(w => w.id === selectedSimWeapon) || filteredWeapons[0];
            if (!currentWeapon) {
                selectedSimWeapon = "";
                weaponTrigger.innerText = "선택 가능한 총기 없음";
                weaponOptions.innerHTML = `<div class="custom-option" style="color: var(--text-muted); cursor: default;">총기 데이터가 없습니다</div>`;
            } else {
                selectedSimWeapon = currentWeapon.id;
                weaponTrigger.innerText = currentWeapon.name;

                // 총기 드롭다운 옵션 생성
                weaponOptions.innerHTML = "";
                filteredWeapons.forEach(w => {
                    const opt = document.createElement('div');
                    opt.className = `custom-option ${w.id === selectedSimWeapon ? 'selected' : ''}`;
                    opt.innerText = w.name;
                    opt.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectedSimWeapon = w.id;
                        weaponWrapper.classList.remove('open');
                        initSimulator();
                    });
                    weaponOptions.appendChild(opt);
                });
            }

            weaponTrigger.onclick = (e) => {
                e.stopPropagation();
                if (filteredWeapons.length === 0) return;
                weaponWrapper.classList.toggle('open');
                categoryWrapper.classList.remove('open');
                document.getElementById('simMuzzleWrapper').classList.remove('open');
                document.getElementById('simGripWrapper').classList.remove('open');
            };

            initSimulatorDropdowns();
            calculateSimulation();
        }

        function initSimulatorDropdowns() {
            const muzzleOptions = document.getElementById('simMuzzleOptions');
            const muzzleTrigger = document.getElementById('simMuzzleTrigger');
            const muzzleWrapper = document.getElementById('simMuzzleWrapper');

            const gripOptions = document.getElementById('simGripOptions');
            const gripTrigger = document.getElementById('simGripTrigger');
            const gripWrapper = document.getElementById('simGripWrapper');

            // 1. 머즐 슬롯 옵션 생성
            muzzleOptions.innerHTML = "";

            const noneMuzzleOpt = document.createElement('div');
            noneMuzzleOpt.className = `custom-option ${selectedSimMuzzle === "none" ? 'selected' : ''}`;
            noneMuzzleOpt.innerText = "순정 (None)";
            noneMuzzleOpt.addEventListener('click', (e) => {
                e.stopPropagation();
                selectedSimMuzzle = "none";
                muzzleWrapper.classList.remove('open');
                initSimulatorDropdowns();
                calculateSimulation();
            });
            muzzleOptions.appendChild(noneMuzzleOpt);

            const muzzleAttachments = dataset.filter(item => item.category === "머즐" || item.category === "소음기");
            muzzleAttachments.forEach(item => {
                const opt = document.createElement('div');
                opt.className = `custom-option ${item.id === selectedSimMuzzle ? 'selected' : ''}`;
                opt.innerText = item.name;
                opt.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedSimMuzzle = item.id;
                    muzzleWrapper.classList.remove('open');
                    initSimulatorDropdowns();
                    calculateSimulation();
                });
                muzzleOptions.appendChild(opt);
            });

            muzzleTrigger.onclick = (e) => {
                e.stopPropagation();
                muzzleWrapper.classList.toggle('open');
                document.getElementById('simWeaponWrapper').classList.remove('open');
                document.getElementById('simGripWrapper').classList.remove('open');
            };

            if (selectedSimMuzzle === "none") {
                muzzleTrigger.innerText = "순정 (None)";
            } else {
                const currentMuzzle = dataset.find(i => i.id === selectedSimMuzzle);
                muzzleTrigger.innerText = currentMuzzle ? currentMuzzle.name : "순정 (None)";
            }

            // 2. 그립 슬롯 옵션 생성
            gripOptions.innerHTML = "";

            const noneGripOpt = document.createElement('div');
            noneGripOpt.className = `custom-option ${selectedSimGrip === "none" ? 'selected' : ''}`;
            noneGripOpt.innerText = "순정 (None)";
            noneGripOpt.addEventListener('click', (e) => {
                e.stopPropagation();
                selectedSimGrip = "none";
                gripWrapper.classList.remove('open');
                initSimulatorDropdowns();
                calculateSimulation();
            });
            gripOptions.appendChild(noneGripOpt);

            const gripAttachments = dataset.filter(item => item.category === "그립");
            gripAttachments.forEach(item => {
                const opt = document.createElement('div');
                opt.className = `custom-option ${item.id === selectedSimGrip ? 'selected' : ''}`;
                opt.innerText = item.name;
                opt.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedSimGrip = item.id;
                    gripWrapper.classList.remove('open');
                    initSimulatorDropdowns();
                    calculateSimulation();
                });
                gripOptions.appendChild(opt);
            });

            gripTrigger.onclick = (e) => {
                e.stopPropagation();
                gripWrapper.classList.toggle('open');
                document.getElementById('simWeaponWrapper').classList.remove('open');
                document.getElementById('simMuzzleWrapper').classList.remove('open');
            };

            if (selectedSimGrip === "none") {
                gripTrigger.innerText = "순정 (None)";
            } else {
                const currentGrip = dataset.find(i => i.id === selectedSimGrip);
                gripTrigger.innerText = currentGrip ? currentGrip.name : "순정 (None)";
            }

            document.addEventListener('click', () => {
                document.getElementById('simCategoryWrapper').classList.remove('open');
                document.getElementById('simWeaponWrapper').classList.remove('open');
                muzzleWrapper.classList.remove('open');
                gripWrapper.classList.remove('open');
            });
        }

        function calculateSimulation() {
            const weapon = weapons.find(w => w.id === selectedSimWeapon) || weapons[0];
            const simStatsCard = document.getElementById('simStatsCard');
            const simPartsCard = document.getElementById('simPartsCard');

            if (!weapon) {
                simStatsCard.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px;">총기 데이터를 로드할 수 없습니다.</div>`;
                return;
            }

            const muzzle = dataset.find(i => i.id === selectedSimMuzzle);
            const grip = dataset.find(i => i.id === selectedSimGrip);

            simStatsCard.innerHTML = `
                <div style="display: flex; flex-wrap: wrap; gap: 4px; width: 100%; justify-content: space-between; font-size: 0.68rem; font-weight: 700;">
                    <div style="background: var(--chip-bg); padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border-glass); flex: 1 1 calc(50% - 4px); min-width: 0; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">
                        <span style="color: var(--text-muted);">계열:</span> <span style="color: var(--card-title);">${weapon.category}</span>
                    </div>
                    <div style="background: var(--chip-bg); padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border-glass); flex: 1 1 calc(50% - 4px); min-width: 0; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">
                        <span style="color: var(--text-muted);">연사:</span> <span style="color: var(--card-title);">${weapon.firerate}</span>
                    </div>
                    <div style="background: var(--chip-bg); padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border-glass); flex: 1 1 calc(50% - 4px); min-width: 0; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">
                        <span style="color: var(--text-muted);">대미지:</span> <span style="color: var(--card-title);">${weapon.maxDamage}~${weapon.minDamage} (${weapon.baseStats.minRange}~${weapon.baseStats.maxRange})</span>
                    </div>
                    <div style="background: var(--chip-bg); padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border-glass); flex: 1 1 calc(50% - 4px); min-width: 0; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">
                        <span style="color: var(--text-muted);">탄속/ADS:</span> <span style="color: var(--card-title);">${weapon.baseStats.muzzleVelocity}s | ${weapon.baseStats.adsSpeed}f</span>
                    </div>
                </div>
            `;

            if (muzzle || grip) {
                simPartsCard.style.display = 'flex';
                simPartsCard.innerHTML = `
                    <div style="font-size: 0.8rem; font-weight: 800; color: var(--card-title); border-bottom: 1px dashed var(--border-glass); padding-bottom: 6px; margin-bottom: 4px;">장착 부착물 상세 정보</div>
                    <div style="font-size:0.74rem; display:flex; flex-direction:column; gap:8px;">
                        ${muzzle ? `<div><strong style="color: var(--accent-color);">${muzzle.name}:</strong> ${highlightText(muzzle.advanced)}</div>` : ''}
                        ${grip ? `<div><strong style="color: var(--accent-color);">${grip.name}:</strong> ${highlightText(grip.advanced)}</div>` : ''}
                    </div>
                `;
            } else {
                simPartsCard.style.display = 'none';
                simPartsCard.innerHTML = "";
            }

            const getSimVal = (key) => {
                const baseVal = weapon.baseRecoil[key];
                const mulMuzzle = muzzle ? (1 + parseRecoilValue(muzzle[key]) / 100) : 1;
                const mulGrip = grip ? (1 + parseRecoilValue(grip[key]) / 100) : 1;
                return baseVal * mulMuzzle * mulGrip;
            };

            const finalTransVert = getSimVal("modelTransVert");
            const finalTransHoriz = getSimVal("modelTransHoriz");
            const finalTransDepth = getSimVal("modelTransDepth");
            const finalRotVert = getSimVal("modelRotVert");
            const finalRotHoriz = getSimVal("modelRotHoriz");
            const finalCamVert = getSimVal("camVert");
            const finalCamHoriz = getSimVal("camHoriz");

            const barsContainer = document.getElementById('simStatBars');
            barsContainer.innerHTML = `
                <div style="font-size: 0.76rem; font-weight: 800; color: var(--accent-color); margin-bottom: 4px;">총구 반동 (Model Recoil)</div>
                ${createSimBarHtml("총구 이동 수직", "modelTransVert", weapon.baseRecoil.modelTransVert, finalTransVert)}
                ${createSimBarHtml("총구 이동 수평", "modelTransHoriz", weapon.baseRecoil.modelTransHoriz, finalTransHoriz)}
                ${createSimBarHtml("총구 이동 전후", "modelTransDepth", weapon.baseRecoil.modelTransDepth, finalTransDepth)}
                ${createSimBarHtml("총구 회전 수직", "modelRotVert", weapon.baseRecoil.modelRotVert, finalRotVert)}
                ${createSimBarHtml("총구 회전 수평", "modelRotHoriz", weapon.baseRecoil.modelRotHoriz, finalRotHoriz)}
                
                <div style="font-size: 0.76rem; font-weight: 800; color: var(--accent-color); margin-top: 10px; margin-bottom: 4px;">화면 반동 (Camera Recoil)</div>
                ${createSimBarHtml("화면 반동 수직", "camVert", weapon.baseRecoil.camVert, finalCamVert)}
                ${createSimBarHtml("화면 반동 수평", "camHoriz", weapon.baseRecoil.camHoriz, finalCamHoriz)}
            `;

            setTimeout(() => {
                const fills = document.querySelectorAll('.sim-fill-bar');
                fills.forEach(bar => {
                    const targetWidth = bar.getAttribute('data-width');
                    bar.style.width = targetWidth + '%';
                });
            }, 50);
        }

        function createSimBarHtml(label, key, baseVal, finalVal) {
            const maxLimits = {
                modelTransVert: 2.0,
                modelTransHoriz: 2.0,
                modelTransDepth: 8.0,
                modelRotVert: 0.5,
                modelRotHoriz: 0.5,
                camVert: 5.0,
                camHoriz: 2.0
            };

            const maxRef = maxLimits[key] || 5.0;
            const basePct = Math.min(Math.max((Math.abs(baseVal) / maxRef) * 100, 2), 100);
            const finalPct = Math.min(Math.max((Math.abs(finalVal) / maxRef) * 100, 2), 100);

            const baseAbs = Math.abs(baseVal);
            const finalAbs = Math.abs(finalVal);
            const diffPct = baseAbs > 0.001 ? ((finalAbs - baseAbs) / baseAbs) * 100 : 0;

            let changeText = "";
            let barColor = "var(--accent-color)";

            if (diffPct < -0.01) {
                changeText = `<span style="color: var(--benefit-text); font-weight: 800; font-size: 0.65rem; margin-left: 4px;">↓${Math.abs(diffPct).toFixed(1)}%</span>`;
                barColor = "var(--benefit-text)";
            } else if (diffPct > 0.01) {
                changeText = `<span style="color: var(--penalty-text); font-weight: 800; font-size: 0.65rem; margin-left: 4px;">↑${Math.abs(diffPct).toFixed(1)}%</span>`;
                barColor = "var(--penalty-text)";
            } else {
                changeText = `<span style="color: var(--text-muted); font-size: 0.65rem; margin-left: 4px;">-</span>`;
            }

            return `
                <div class="sim-bar-item" style="display: flex; gap: 10px; align-items: center; min-height: 28px;">
                    <!-- Left: Label & Values -->
                    <div style="width: 44%; display: flex; flex-direction: column; justify-content: center; line-height: 1.25;">
                        <span style="color: var(--card-title); font-size: 0.72rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${label}</span>
                        <span style="color: var(--text-muted); font-size: 0.64rem; white-space: nowrap;">
                            ${baseVal.toFixed(2)} <span style="font-size: 0.6rem; opacity: 0.7;">→</span> <strong style="color: var(--card-title); font-weight: 800;">${finalVal.toFixed(2)}</strong>${changeText}
                        </span>
                    </div>
                    <!-- Right: The Bar -->
                    <div style="width: 56%; display: flex; align-items: center;">
                        <div style="position: relative; width: 100%; height: 6px; background: var(--chip-bg); border-radius: 3px; overflow: hidden; border: 1px solid var(--border-glass);">
                            <!-- Base marker -->
                            <div style="position: absolute; top: 0; bottom: 0; left: 0; width: ${basePct}%; background: var(--sim-base-bar); border-radius: 2px; border-right: 1.5px solid var(--sim-base-border); z-index: 1;"></div>
                            <!-- Final simulated active bar -->
                            <div class="sim-fill-bar" data-width="${finalPct}" style="position: absolute; top: 0; bottom: 0; left: 0; width: 0%; background: ${barColor}; border-radius: 2px; transition: all 0.2s ease; z-index: 2;"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 애플리케이션 시작점
        window.onload = async () => {
            renderList();
            initCompareDropdowns();
            initDragScroll('.filter-row');
            await loadWeaponsData();
        };
    </script>
</body>

</html>
