<!DOCTYPE html>
<html lang="ko" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PF Attachment Database ver. 11.15.0c</title>
    <style>
        /* CSS 변수 설계 (테마용) */
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --bg-glass: rgba(255, 255, 255, 0.4);
            --border-glass: rgba(255, 255, 255, 0.3);
            --shadow-glass: rgba(31, 38, 135, 0.08);
            --text-color: #2c3e50;
            --text-muted: #7f8c8d;
            --accent-color: #5c6bc0;
            --card-bg: rgba(255, 255, 255, 0.45);
            --card-title: #1a252f;
            --table-header: rgba(255, 255, 255, 0.5);
            --badge-green: rgba(46, 204, 113, 0.2);
            --badge-green-text: #27ae60;
            --badge-red: rgba(231, 76, 60, 0.2);
            --badge-red-text: #c0392b;
            --benefit-text: #178a46;
            --penalty-text: #c7352f;
            --filter-active-bg: rgba(92, 107, 192, 0.18);
            --chip-bg: rgba(255, 255, 255, 0.34);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --bg-glass: rgba(15, 23, 42, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --shadow-glass: rgba(0, 0, 0, 0.3);
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-color: #818cf8;
            --card-bg: rgba(15, 23, 42, 0.7);
            --card-title: #f8fafc;
            --table-header: rgba(15, 23, 42, 0.5);
            --benefit-text: #7ddf9f;
            --penalty-text: #ff8b86;
            --filter-active-bg: rgba(129, 140, 248, 0.18);
            --chip-bg: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
            -ms-overflow-style: none;
            /* IE/Edge 스크롤바 숨기기 */
            scrollbar-width: none;
            /* Firefox 스크롤바 숨기기 */
        }

        /* Chrome, Safari, Opera, Edge (Webkit) 스크롤바 숨기기 */
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }

        /* 글래스모피즘용 고정 배경 광원 */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.55;
            transition: all 0.5s ease;
        }

        .blob-1 {
            width: 320px;
            height: 320px;
            background: #a78bfa;
            top: 10%;
            left: -80px;
        }

        .blob-2 {
            width: 300px;
            height: 300px;
            background: #60a5fa;
            bottom: 15%;
            right: -80px;
        }

        /* 모바일 우선 컨테이너 */
        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 90px;
            /* 하단 네비게이션 공간 */
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 글래스 공통 프레임 */
        .glass-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            box-shadow: 0 8px 32px 0 var(--shadow-glass);
            border-radius: 20px;
            padding: 16px;
            transition: all 0.3s ease;
        }

        /* 헤더 레이아웃 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--card-title);
        }

        .theme-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid var(--border-glass);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            color: var(--text-color);
            transition: background 0.3s;
        }

        .theme-btn:active {
            transform: scale(0.95);
        }

        /* 검색창 */
        .search-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 10px 14px;
            position: sticky;
            top: 10px;
            z-index: 80;
            box-shadow: 0 4px 20px var(--shadow-glass);
        }

        /* 플로팅 컨트롤 버튼 스타일 */
        .floating-jump-btn:hover {
            opacity: 0.7;
        }

        .floating-jump-btn:active {
            transform: scale(0.95);
        }

        #scrollTopBtn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        #scrollTopBtn:active {
            transform: translateY(0) scale(0.9);
        }

        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            width: 100%;
            font-size: 0.95rem;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        /* 탭 컨텐츠 관리 */
        .tab-content {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .tab-content.active {
            display: flex;
        }

        .filter-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px -10px var(--shadow-glass);
            border-radius: 22px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .filter-panel {
            background: rgba(20, 25, 45, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 12px 35px -10px rgba(0, 0, 0, 0.5);
        }

        .filter-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-bottom: 6px;
            border-bottom: 1px dashed rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] .filter-header {
            border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
        }

        .filter-header-title {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 0.5px;
        }

        .filter-header-icon {
            display: flex;
            align-items: center;
            color: var(--accent-color);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-label {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-muted);
            margin-left: 2px;
        }

        .filter-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            /* ← 추가: iOS 관성 스크롤 */
            cursor: grab;
            /* ← 추가: 데스크탑 드래그 커서 */
        }

        .filter-row::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            border: 1px solid var(--border-glass);
            background: var(--chip-bg);
            color: var(--text-color);
            opacity: 0.85;
            border-radius: 12px;
            padding: 7px 12px;
            font-size: 0.76rem;
            font-weight: 800;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-chip:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.6);
            border-color: var(--accent-color);
        }

        [data-theme="dark"] .filter-chip:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .filter-chip.active {
            opacity: 1;
            color: #ffffff;
            background: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 4px 12px rgba(92, 107, 192, 0.25);
        }

        [data-theme="dark"] .filter-chip.active {
            box-shadow: 0 4px 12px rgba(129, 140, 248, 0.35);
        }

        .section-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 8px;
            border-radius: 10px;
            transition: background 0.2s, opacity 0.2s;
            cursor: pointer;
            user-select: none;
        }

        .section-heading:hover {
            background: rgba(255, 255, 255, 0.18);
            opacity: 0.95;
        }

        [data-theme="dark"] .section-heading:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .section-heading h3 {
            color: var(--card-title);
            font-size: 0.92rem;
            font-weight: 900;
        }

        .section-count {
            color: var(--text-muted);
            font-size: 0.74rem;
            font-weight: 700;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag-pill {
            border-radius: 999px;
            border: 1px solid var(--border-glass);
            background: var(--chip-bg);
            padding: 4px 8px;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-muted);
        }

        .text-benefit {
            color: var(--benefit-text);
            font-weight: 800;
        }

        .text-penalty {
            color: var(--penalty-text);
            font-weight: 800;
        }

        /* 카드 리스트 */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .item-card:hover {
            border-color: rgba(92, 107, 192, 0.35);
            box-shadow: 0 10px 24px var(--shadow-glass);
        }

        .item-card:active {
            transform: scale(0.98);
        }

        .item-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
        }

        .item-card-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--card-title);
            line-height: 1.25;
        }

        .badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.25);
            color: var(--text-color);
            border: 1px solid var(--border-glass);
            flex-shrink: 0;
        }

        .stat-chip-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .stat-chip {
            min-width: 0;
            background: var(--chip-bg);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 8px 10px;
        }

        .stat-chip-label {
            display: block;
            font-size: 0.68rem;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 0;
            margin-bottom: 3px;
        }

        .stat-chip-value {
            display: block;
            font-size: 0.82rem;
            color: var(--text-color);
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            gap: 12px;
        }

        .card-footer-link {
            color: var(--accent-color);
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 2px;
            transition: transform 0.2s ease;
        }

        .card-footer-link svg {
            transition: transform 0.2s ease;
        }

        .item-card:hover .card-footer-link svg {
            transform: translateX(3px);
        }

        .empty-state {
            color: var(--text-muted);
            text-align: center;
            padding: 28px 10px;
        }

        /* 상세 모달 팝업 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.24s ease-out;
        }

        .modal-content {
            width: 100%;
            max-width: 480px;
            background: var(--bg-glass);
            border-top: 1px solid var(--border-glass);
            border-radius: 24px 24px 0 0;
            padding: 20px;
            max-height: 85vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateY(100%);
            transition: transform 0.36s cubic-bezier(0, 0, 0.2, 1);
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            color: var(--text-color);
            cursor: pointer;
        }

        /* 표 스타일 (구글 문서 / 마크다운 렌더링 스타일) */
        .stat-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.85rem;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-glass);
        }

        .stat-table th,
        .stat-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-glass);
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .stat-table th {
            background: var(--table-header);
            font-weight: 700;
            color: var(--card-title);
        }

        .stat-table td {
            background: rgba(255, 255, 255, 0.1);
        }

        .stat-row-title {
            font-weight: 600;
            color: var(--text-muted);
        }

        .markdown-block {
            color: var(--text-color);
            font-size: 0.86rem;
            line-height: 1.65;
            word-break: keep-all;
            overflow-wrap: anywhere;
        }

        .markdown-block p {
            margin: 0;
        }

        .markdown-block strong {
            color: var(--card-title);
            font-weight: 800;
        }

        .section-title {
            font-weight: 800;
            font-size: 0.95rem;
            color: var(--card-title);
            margin-top: 5px;
        }

        /* 비교 기능 UI */
        .compare-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .selector-box {
            display: flex;
            gap: 10px;
        }

        /* 커스텀 셀렉트 드롭다운 스타일 */
        .custom-select-wrapper {
            position: relative;
            width: 50%;
            user-select: none;
        }

        .custom-select-trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            padding: 10px 14px;
            border-radius: 12px;
            color: var(--text-color);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .custom-select-trigger::after {
            content: "";
            width: 6px;
            height: 6px;
            border-right: 2px solid var(--text-color);
            border-bottom: 2px solid var(--text-color);
            transform: rotate(45deg);
            margin-bottom: 2px;
            transition: transform 0.3s ease;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .custom-select-wrapper.open .custom-select-trigger::after {
            transform: rotate(-135deg);
            margin-bottom: -2px;
        }

        .custom-options {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            box-shadow: 0 10px 24px var(--shadow-glass);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.25s cubic-bezier(0, 0, 0.2, 1);
            max-height: 250px;
            overflow-y: auto;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        [data-theme="dark"] .custom-options {
            background: rgba(15, 23, 42, 0.9);
        }

        .custom-select-wrapper.open .custom-options {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .custom-option {
            padding: 10px 14px;
            font-size: 0.88rem;
            color: var(--text-color);
            cursor: pointer;
            transition: background 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .custom-option:hover {
            background: rgba(92, 107, 192, 0.15);
        }

        .custom-option.selected {
            background: rgba(92, 107, 192, 0.25);
            color: var(--accent-color);
            font-weight: 700;
        }

        .custom-options::-webkit-scrollbar {
            width: 5px;
        }

        .custom-options::-webkit-scrollbar-thumb {
            background: var(--border-glass);
            border-radius: 999px;
        }

        .compare-badge-up {
            background: var(--badge-green);
            color: var(--badge-green-text);
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: bold;
        }

        .compare-badge-down {
            background: var(--badge-red);
            color: var(--badge-red-text);
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: bold;
        }

        /* 하단 고정 네비게이션 */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 448px;
            height: 60px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            box-shadow: 0 8px 32px 0 var(--shadow-glass);
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
        }

        [data-theme="dark"] .bottom-nav {
            background: rgba(15, 23, 42, 0.7);
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            width: 33%;
            height: 100%;
            justify-content: center;
            transition: color 0.2s;
        }

        .nav-btn.active {
            color: var(--accent-color);
        }

        .nav-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        #floatingControlCenter {
            position: fixed;
            bottom: 85px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px var(--shadow-glass);
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
        }

        @media (min-width: 480px) {
            #floatingControlCenter {
                right: calc(50% - 224px);
            }
        }
    </style>
</head>

<body>

    <!-- 글래스모피즘용 고정 배경 blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="app-container">

        <!-- 헤더 영역 -->
        <header class="glass-panel header">
            <h1>PF 부착물 라이브러리 <span
                    style="font-size: 0.85rem; font-weight: 500; color: var(--text-muted); margin-left: 8px; vertical-align: middle;">ver.
                    11.15.0c</span></h1>
            <button class="theme-btn" id="themeToggleBtn">☀️</button>
        </header>

        <!-- [탭 1] 부착물 목록 -->
        <main id="listTab" class="tab-content active">
            <!-- 검색 튜브 -->
            <div class="glass-panel search-bar">
                <input type="text" id="searchInput" placeholder="부착물 이름 또는 카테고리 검색...">
            </div>

            <div class="glass-panel filter-panel">
                <div class="filter-header">

                    return `<span style="color: var(--accent-color); font-weight: 700; font-size: 0.72rem;">반전</span>`;

            if (text.includes("감소") || text.includes("안정") || text.includes("완화") || text.includes("감쇠") || text.includes("단축") || text.includes("개선")) {
                return `<span style="color: var(--benefit-text); font-weight: 800;">↓${pctText}</span>`;

            if (text.includes("증가") || text.includes("패널티") || text.includes("지연") || text.includes("악화") || text.includes("상승")) {

        function parseRecoilValue(text) {
            if (!text || text.includes("변화 없음")) return 0;

            // Check if it's a range like "10~20%"
            const rangeMatch = text.match(/(\d+(?:\.\d+)?)\s*~\s*(\d+(?:\.\d+)?)/);
            let value = 0;
            if (rangeMatch) {
                value = (parseFloat(rangeMatch[1]) + parseFloat(rangeMatch[2])) / 2;
            } else {
                const percentMatch = text.match(/(\d+(?:\.\d+)?)/);
                if (!percentMatch) return 0;
                value = parseFloat(percentMatch[1]);
            }

            // Check if it represents a reduction or an increase
            if (text.includes("감소") || text.includes("안정") || text.includes("완화") || text.includes("감쇠") || text.includes("단축") || text.includes("개선")) {
                return -value;
            }
            if (text.includes("증가") || text.includes("패널티") || text.includes("지연") || text.includes("악화") || text.includes("상승")) {
                return value;
            }
            return 0;
        }

        function getBarStyles(valText) {
            const x = parseRecoilValue(valText);
            const maxVal = 40; // 40% is the max scale of recoil change
            const clamped = Math.min(Math.max(x, -maxVal), maxVal);

            const widthPct = Math.abs(clamped) * (50 / maxVal); // max 50% width
            let leftPct;
            let color;

            if (clamped < 0) {
                leftPct = 50 - widthPct;
                color = "var(--benefit-text)";
            } else if (clamped > 0) {
                leftPct = 50;
                color = "var(--penalty-text)";
            } else {
                leftPct = 50;
                color = "transparent";
            }

            return { left: leftPct, width: widthPct, color };
        }

            const valWeight = isNeutral ? "500" : "800";

            return `
                <div class="stat-bar-item" style="display: flex; flex-direction: column; gap: 4px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: 700;">

            document.getElementById('customSelect1Trigger').innerText = item1 ? item1.name : "선택 1";
            document.getElementById('customSelect2Trigger').innerText = item2 ? item2.name : "선택 2";

            // Select 1 옵션 생성 (전체 아이템 제공)
            const options1Container = document.getElementById('customSelect1Options');
            options1Container.innerHTML = "";
            orderedDataset.forEach(item => {
                const optEl = document.createElement('div');
                optEl.className = `custom-option ${item.id === selectedId1 ? 'selected' : ''}`;
                optEl.innerText = item.name;
                optEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedId1 = item.id;

                    // 호환 가능 그룹 체크하여 강제 전환
                    const newGroup1 = getCompatibleGroup(item);
                    const currentItem2 = orderedDataset.find(i => i.id === selectedId2);
                    const group2 = getCompatibleGroup(currentItem2);

                    if (newGroup1 !== group2) {
                        const fallbackItem = orderedDataset.find(i => getCompatibleGroup(i) === newGroup1 && i.id !== item.id);
                        selectedId2 = fallbackItem ? fallbackItem.id : item.id;
                    }

                    document.getElementById('customSelect1Wrapper').classList.remove('open');
                    updateCustomDropdowns();
                    renderCompare();
                });
                options1Container.appendChild(optEl);
            });

            // Select 2 옵션 생성 (Select 1과 동일 그룹만 제공하여 다른 종류 비교 원천 차단)
            const options2Container = document.getElementById('customSelect2Options');
            options2Container.innerHTML = "";
            const compatibleItems = orderedDataset.filter(item => getCompatibleGroup(item) === group1);
            compatibleItems.forEach(item => {
                const optEl = document.createElement('div');
                optEl.className = `custom-option ${item.id === selectedId2 ? 'selected' : ''}`;
                optEl.innerText = item.name;
                optEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedId2 = item.id;
                    document.getElementById('customSelect2Wrapper').classList.remove('open');
                    updateCustomDropdowns();
                    renderCompare();
                });
                options2Container.appendChild(optEl);
            });
        }

        // 특정 성능 데이터의 유불리를 판별해 글래스 배지를 부착하는 헬퍼 함수
        function getCompareBadge(value) {
            if (value.includes("감소") || value.includes("안정")) {
                return `<span class="compare-badge-up">${value}</span>`;
            } else if (value.includes("증가") || value.includes("패널티") || value.includes("저하")) {
                return `<span class="compare-badge-down">${value}</span>`;
            } else {
                return `<span>${value}</span>`;
            }
        }

        function renderCompare() {
            const id1 = selectedId1;
            const id2 = selectedId2;

            const item1 = orderedDataset.find(i => i.id === id1);
            const item2 = orderedDataset.find(i => i.id === id2);

            if (!item1 || !item2) return;

            const showNoiseRow = item1.noiseRange || item2.noiseRange;
            let noiseRowHtml = "";
            if (showNoiseRow) {
                const val1 = item1.noiseRange || "Unsuppressed (소음 효과 없음)";
                const val2 = item2.noiseRange || "Unsuppressed (소음 효과 없음)";

                const getNoiseStyle = (val) => {
                    if (val.includes("Unsuppressed") || val.includes("소음 효과 없음")) {
                        return `color: var(--text-muted); font-weight: 500;`;
                    }
                    return `color: var(--benefit-text); font-weight: 800;`;
                };

                noiseRowHtml = `
                    <tr>
                        <td class="stat-row-title">소음 감지 범위</td>
                        <td style="${getNoiseStyle(val1)}">${val1}</td>
                        <td style="${getNoiseStyle(val2)}">${val2}</td>
                    </tr>
                `;
            }

            const getCompareNoiseBlock = (item) => {
                if (!item.noiseRange) return "";
                return `
                    <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 2px; padding: 6px 10px; background: rgba(46, 204, 113, 0.1); border-radius: 8px; border: 1px solid var(--border-glass);">
                        <div style="font-size: 0.8rem; font-weight: 700; color: var(--benefit-text); display: flex; align-items: center; gap: 4px;">
                            <span>🔕</span>
                            <span style="color: var(--text-color); opacity: 0.8; font-weight: 600;">소음 감지:</span>
                            <span>${item.noiseRange}</span>
                        </div>
                        ${item.noiseDesc ? `<div style="font-size: 0.78rem; opacity: 0.85; line-height: 1.3;">${highlightText(item.noiseDesc)}</div>` : ''}
                    </div>
                `;
            };

            compareTableContainer.innerHTML = `
                <table class="stat-table" style="margin-top: 10px;">
                    <thead>
                        <tr>
                            <th>성능 지표</th>
                            <th>${item1.name}</th>
                            <th>${item2.name}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="stat-row-title">모델 수직 (총구)</td>
                            <td>${getCompareBadge(item1.modelVert)}</td>
                            <td>${getCompareBadge(item2.modelVert)}</td>
                        </tr>
                        <tr>
                            <td class="stat-row-title">모델 수평 (총구)</td>
                            <td>${getCompareBadge(item1.modelHoriz)}</td>
                            <td>${getCompareBadge(item2.modelHoriz)}</td>
                        </tr>
                        <tr>
                            <td class="stat-row-title">카메라 수직 (화면)</td>
                            <td>${getCompareBadge(item1.camVert)}</td>
                            <td>${getCompareBadge(item2.camVert)}</td>
                        </tr>
                        <tr>
                            <td class="stat-row-title">카메라 수평 (화면)</td>
                            <td>${getCompareBadge(item1.camHoriz)}</td>
                            <td>${getCompareBadge(item2.camHoriz)}</td>
                        </tr>
                        ${noiseRowHtml}
                    </tbody>
                </table>
                <div class="glass-panel markdown-block" style="margin-top: 12px; padding: 12px;">
                    <div style="font-weight:700; font-size:0.9rem; margin-bottom:4px; color: var(--card-title);">${item1.name} 성향</div>
                    <div>${highlightText(item1.advanced)}</div>
                    ${getCompareNoiseBlock(item1)}
                </div>
                <div class="glass-panel markdown-block" style="margin-top: 10px; padding: 12px;">
                    <div style="font-weight:700; font-size:0.9rem; margin-bottom:4px; color: var(--card-title);">${item2.name} 성향</div>
                    <div>${highlightText(item2.advanced)}</div>
                    ${getCompareNoiseBlock(item2)}
                </div>
            `;
        }

        // 좌우 드래그 및 마우스 휠 슬라이드(스크롤) 기능 활성화
        function initDragScroll(selector) {
            const sliders = document.querySelectorAll(selector);
            sliders.forEach(slider => {
                let isDown = false;
                let startX;
                let scrollLeft;

                slider.addEventListener('mousedown', (e) => {
                    isDown = true;
                    slider.style.cursor = 'grabbing';
                    startX = e.pageX - slider.offsetLeft;
                    scrollLeft = slider.scrollLeft;
                });

                slider.addEventListener('mouseleave', () => {
                    isDown = false;
                    slider.style.cursor = 'grab';
                });

                slider.addEventListener('mouseup', () => {
                    isDown = false;
                    slider.style.cursor = 'grab';
                });

                slider.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - slider.offsetLeft;
                    const walk = (x - startX) * 1.5; // 스크롤 감도
                    slider.scrollLeft = scrollLeft - walk;
                });

                // 마우스 휠로 좌우 슬라이드(스크롤) 가능하게 구현
                slider.addEventListener('wheel', (e) => {
                    if (e.deltaY !== 0) {
                        e.preventDefault();
                        slider.scrollLeft += e.deltaY * 0.8; // 부드러운 스크롤 감도
                    }
                });
            });
        }

        // 플로팅 컨트롤 및 퀵점프 관련 함수
        function scrollToSection(id) {
            const el = document.getElementById(id);
            if (el) {
                const yOffset = -70; // sticky 검색창 고려 오프셋
                const y = el.getBoundingClientRect().top + window.pageYOffset + yOffset;
                window.scrollTo({ top: y, behavior: 'smooth' });
            }
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 스크롤 감지에 따른 플로팅 바 토글 (목록 탭에서만 활성화)
        window.addEventListener('scroll', () => {
            const cc = document.getElementById('floatingControlCenter');
            const listTab = document.getElementById('listTab');
            const isListTabActive = listTab && listTab.classList.contains('active');

            if (isListTabActive && window.scrollY > 200) {
                cc.style.opacity = '1';
                cc.style.pointerEvents = 'auto';
                cc.style.transform = 'translateY(0)';
            } else {
                cc.style.opacity = '0';
                cc.style.pointerEvents = 'none';
                cc.style.transform = 'translateY(10px)';
            }
        });

        // 애플리케이션 시작점
        window.onload = () => {
            renderList();
            initCompareDropdowns();
            initDragScroll('.filter-row');
        };
    </script>
</body>

</html>
